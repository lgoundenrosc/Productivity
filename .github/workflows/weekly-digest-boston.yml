name: Weekly Boston events digest

on:
  schedule:
    # Two slots so one lands at 6:50 ET in both EDT and EST; the script
    # skips the other. GitHub may start scheduled jobs a few minutes late.
    - cron: "50 10 * * 1"
    - cron: "50 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # to commit data/boston/seen.json

concurrency: weekly-digest-boston

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and send digest
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.BOSTON_DIGEST_TO || secrets.DIGEST_TO }}
        run: python -m tracker.main --city boston
      - name: Save which events were already sent
        run: |
          git config user.name "events-digest-bot"
          git config user.email "events-digest-bot@users.noreply.github.com"
          git add data/boston/seen.json
          git diff --cached --quiet || git commit -m "Record events sent in this week's Boston digest"
          git pull --rebase  # the DC digest may have pushed first
          git push
