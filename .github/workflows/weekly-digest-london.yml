name: Weekly London LP events digest

on:
  schedule:
    # Two slots so one lands at 6:50 UK time in both BST and GMT; the script
    # skips the other. GitHub may start scheduled jobs a few minutes late.
    - cron: "50 5 * * 1"
    - cron: "50 6 * * 1"
  workflow_dispatch: {}
  # Temporary: a push to the build branch emails a test digest for the week of Nov 2.
  push:
    branches: [claude/nifty-heisenberg-2gjpp8]
    paths: [config/london/**, .github/workflows/weekly-digest-london.yml]

permissions:
  contents: write   # to commit data/london/seen.json

concurrency: weekly-digest-london

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and send digest
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.LONDON_DIGEST_TO || secrets.DIGEST_TO }}
        run: python -m tracker.main --city london ${{ github.event_name == 'push' && '--test --start 2026-11-02' || '' }}
      - name: Save which events were already sent
        if: github.event_name != 'push'
        run: |
          git config user.name "events-digest-bot"
          git config user.email "events-digest-bot@users.noreply.github.com"
          git add data/london/seen.json
          git diff --cached --quiet || git commit -m "Record events sent in this week's London digest"
          git pull --rebase  # the DC or Boston digest may have pushed first
          git push
