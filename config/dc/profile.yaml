# The city the digest covers. `area` goes into Claude's prompts.
city:
  name: DC
  long_name: Washington
  area: "the Washington, DC area (DC, Northern Virginia and suburban Maryland)"
  local_label: Washington area
  seen_file: data/seen.json

# Who the digest is for. This text goes to Claude verbatim when scoring.
reader: >
  Senior associate at a defense-focused pre-seed and seed venture fund in
  Washington, DC. Attends events to meet founders, government buyers and
  co-investors, and to track where defense money and policy are heading.

interests: >
  Early-stage startups and venture capital in defense and dual-use tech;
  deep tech; robotics, autonomy and drones; space; AI and compute; defense
  acquisition reform, DIU, OTAs, PPBE, the Office of Strategic Capital and
  the defense industrial base; critical minerals (mining, processing and
  refining, rare earths, stockpiling and the financing behind them);
  advanced and critical materials as materials science (new alloys,
  composites, ceramics, metamaterials, materials discovery); supply chains
  as they touch startups (magnets, motors, batteries, energetics, components
  and domestic manufacturing that hardware startups depend on); export controls and
  US-China tech competition; quantum. Separately, a personal interest in AI x biosecurity,
  biological, chemical and nuclear (WMD) risk, and AI safety as it bears on
  catastrophic misuse.

boost: >
  Speakers from DIU, CDAO, DARPA, OSC, service acquisition executives, HASC
  or SASC members and staff, defense tech founders and venture investors.
  In-person events in the DC area, above all ones with networking or
  receptions. Happy hours and meetups where defense tech founders, investors
  and government buyers gather. General DC venture capital and startup
  investor events, which are good for networking even without a defense angle. Events outside DC only when they are major
  conferences worth traveling for.

penalize: >
  Regional diplomacy with no technology angle, domestic social policy, book
  talks with no tech or defense angle, events outside the DC area (unless a
  major defense or space conference), virtual-only webinars. Networking
  events aimed at a demographic or affinity group the reader would not be
  part of (for example a Black professionals' mixer or a women's investing
  event), student-only or alumni-only events, and members-only events.
  Pure cybersecurity events (cyber defense, compliance, CMMC, zero trust,
  threat intelligence) unless they tie directly to AI, space or defense tech
  startups.

# Digest sections, in display order. Claude assigns each event one category.
categories:
  - {id: venture,   name: "Startups, venture and deep tech"}
  - {id: defense,   name: "Defense tech, acquisition and industrial base"}
  - {id: ai,        name: "AI and compute"}
  - {id: aibio,     name: "AI x bio and WMD risk"}
  - {id: minerals,  name: "Critical minerals: mining, processing and refining"}
  - {id: materials, name: "Advanced materials and materials science"}
  - {id: supply,    name: "Supply chains and manufacturing for startups"}
  - {id: robotics,  name: "Robotics, autonomy and drones"}
  - {id: space,     name: "Space"}
  - {id: china,     name: "China and tech competition"}
  - {id: other,     name: "Other national security and emerging tech"}  # incl. quantum and relevant cyber

# Added to Claude's score so DC-area events you can walk into rank first.
# Online-only events need a stronger topic to make the cut.
location_bonus:
  local_in_person: 2
  local_hybrid: 1
  online_only: -1

# Told to Claude when it reads each events page.
audience_note: >
  Drop events aimed at a specific demographic or affinity group (for example
  events for a particular race, gender or ethnicity), student-only events such
  as admissions or career fairs, and purely social events.
networking_note: >
  This source is checked for networking. Keep happy hours, receptions, meetups,
  founder and investor gatherings, demo days and pitch nights, above all ones
  touching defense, national security, government tech, deep tech, space,
  robotics, AI or venture. General DC venture capital, startup and investor
  events count even with no defense angle. Drop purely social events (parties,
  fitness, dating, hobbies) and events with no professional angle.
scoring_note: >
  Happy hours and receptions where defense tech founders, investors or
  government buyers gather are valuable even without a program.

min_score: 5        # events below this are dropped from the digest
top_pick_score: 8   # events at or above this get a TOP PICK badge
lookahead_days: 21          # talks, happy hours and other local events
travel_lookahead_days: 120  # conferences and industry days, which need planning or travel
