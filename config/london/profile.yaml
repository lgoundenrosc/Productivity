# The city the digest covers. `area` goes into Claude's prompts.
city:
  name: London
  long_name: London
  area: "Greater London (the City, Canary Wharf, Mayfair, King's Cross, Shoreditch and the rest of Greater London)"
  local_label: London
  seen_file: data/london/seen.json
  timezone: Europe/London
  tz_label: UK time

# Who the digest is for. This text goes to Claude verbatim when scoring.
reader: >
  General partner at Rosc, a pre-seed and seed venture fund that is raising
  its next fund and wants UK and European limited partners. Goes to London
  events mainly to meet LPs: to be in the room with them, to speak or sit on
  a panel in front of them, and to get introductions through fund-of-funds,
  placement agents and other GPs. Rosc invests in defence, national security
  and dual-use technology, so the second reason is the London defence
  community: the investors, procurement leads, primes and policy people who
  shape that market. Seeing other startups and meeting generalist
  co-investors come last.

interests: >
  Limited partners of every kind: single and multi-family offices, wealth
  managers and private banks, pension funds and the Local Government Pension
  Scheme pools, university endowments and foundations, fund-of-funds,
  insurers, sovereign wealth funds with London offices, corporate venture
  arms and government investors such as the British Business Bank, British
  Patient Capital, the National Wealth Fund, the National Security Strategic
  Investment Fund and the NATO Innovation Fund. Emerging manager programmes,
  first-time fund forums and allocator views on venture. Defence, national
  security, space and dual-use technology above everything else in the
  startup world: uncrewed systems, autonomy, sensing, space, energetics,
  advanced manufacturing, resilience and defence procurement reform. Robotics,
  hardware and deep tech next. Software matters only where it serves defence,
  security or space.

boost: >
  Rooms with LPs in them: family office forums and dinners, allocator,
  pension and endowment CIO panels, LP-GP breakfasts, fund-of-funds and
  wealth management events, emerging manager and first-time fundraising
  forums, UK Private Capital (the former BVCA) events, the LBS Family Office
  Conference and Private Capital Symposium, PEI, Campden, Markets Group and
  Opal Group forums held in London, and receptions hosted by fund-of-funds,
  placement agents or fund-formation law firms where LPs and GPs mix. Events
  where government LPs (British Business Bank, NSSIF, NATO Innovation Fund,
  National Wealth Fund) speak about their venture programmes. Defence
  investment events: defence finance and investor forums, UK Defence
  Innovation (UKDI) and DASA investor or industry days, ADS Group briefings
  on what the MOD will buy, RUSI, Council on Geostrategy, IISS and Policy
  Exchange events on defence industry and capability, SMi and Defence iQ
  defence conferences with investor sessions, and defence tech meetups and
  demo days. Open calls for
  speakers or panelists at events LPs attend. Small, curated, invitation-led
  events over large ones.

penalize: >
  Events built for founders learning basics (how to raise, legal or tax 101,
  vendor office hours). Events selling services to fund managers (fund
  administration, compliance or software demos) with no allocators on the
  programme. Software, SaaS, fintech, crypto, martech and AI-application
  events with no link to defence, security, space or hardware, even when
  investors attend. Defence events that are only training on bid writing or
  compliance, or internal member admin. Purely academic talks. Generic startup pitch nights with no
  investors of note, and consumer or ecommerce events. Big expos with no
  investor programme. Webinars. Student-only, resident-only and members-only
  events the reader can't join. Events limited to a gender or racial group,
  since the digest can't tell whether the reader qualifies. Events outside
  Greater London unless they are major LP, family office or venture
  conferences worth traveling for (SuperVenture, SuperReturn, Invest Europe,
  Campden or similar).

audience_note: >
  Drop student-only events (admissions, careers fairs, lectures for enrolled
  students), events open only to residents or members, and purely social
  events (parties, fitness, run clubs, hobbies). Keep investor networks built
  around a nationality, diaspora or community when outside investors can
  attend. Keep closed-door family office and allocator events that a fund
  manager can apply to attend or sponsor, and say so in the summary.
networking_note: >
  This source is checked for networking. Keep receptions, dinners, breakfasts
  and meetups where LPs, family offices, wealth managers or fund managers
  gather, plus investor receptions and demo days. Drop founder-only meetups
  and events with no professional angle.
scoring_note: >
  The reader's fund is raising, so LP access dominates the score. An event
  with allocators, family offices or fund-of-funds in the room scores 7 or
  more; a chance to speak in front of them scores higher still. An event
  full of founders and no LPs rarely scores above 6. Defence comes next: a
  defence investor or defence finance event scores 8 or more, and a defence
  industry or policy event with decision makers on the programme scores 6 to
  8. A software or general tech event with no defence, security, space or
  hardware angle scores 4 or less. Name the LPs, LP types or defence
  decision makers expected in the room in the reason when the page says.

# Receptions and meetups go into the topic sections below, so an LP dinner
# lands under LP access instead of a general networking list.
networking_section: false

# Digest sections, in display order. Claude assigns each event one category.
categories:
  - {id: lp_private,  name: "LP access: family offices, wealth managers and private banks"}
  - {id: lp_inst,     name: "LP access: pensions, endowments, fund-of-funds and government investors"}
  - {id: defence,     name: "Defence, national security and space: investors, industry and policy"}
  - {id: fundraising, name: "Emerging manager, LP-GP and fundraising forums"}
  - {id: speaking,    name: "Speaking and panel slots"}
  - {id: investors,   name: "Co-investors, angel groups and investor networks"}
  - {id: dealflow,    name: "Deal flow: demo days, pitch events and founder showcases"}
  - {id: networking,  name: "Receptions and meetups"}
  - {id: other,       name: "Talks and research worth attending"}

# Added to Claude's score so London events you can walk into rank first.
# LP access depends on being in the room, so online-only events lose more.
location_bonus:
  local_in_person: 2
  local_hybrid: 1
  online_only: -2

# Sent every other Monday, alternating with the Boston digest. Hand-run
# digests (workflow_dispatch or the command line) always send.
send_every_weeks: 2
first_send: 2026-11-09

# The next two weeks lead the digest, each in its own section; later events
# follow by topic.
priority_weeks: 2

min_score: 5        # events below this are dropped from the digest
top_pick_score: 8   # events at or above this get a TOP PICK badge
lookahead_days: 28          # talks, receptions and other local events (four weeks)
travel_lookahead_days: 120  # conferences and speaker calls, which need planning or travel
